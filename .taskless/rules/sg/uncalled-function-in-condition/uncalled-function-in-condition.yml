id: uncalled-function-in-condition
language: Python
severity: warning
message: "`$F` is a function, so this condition is always true. Did you mean `$F()`?"
note: |
  A function object is always truthy, so `if f:` is true even when the author meant `if f():`.
  Only functions defined at module level in the same file are checked. A parameter or local
  assignment with the same name skips it. ty's `redundant-condition` reports the same thing.
utils:
  # The slot a condition sits in. For `a if cond else b` that is the middle operand only;
  # the other two are values.
  condition-slot:
    any:
      - inside: { kind: if_statement, field: condition }
      - inside: { kind: elif_clause, field: condition }
      - inside: { kind: while_statement, field: condition }
      - all:
          - nthChild: 2
          - inside: { kind: conditional_expression }
  # A condition, or part of one through `and`/`or`/`not`/parens. `convert or default_fn`
  # outside a condition is a fallback value, so the chain has to end in a condition slot.
  in-condition:
    any:
      - matches: condition-slot
      - inside:
          stopBy:
            not:
              any: [ { kind: boolean_operator }, { kind: not_operator }, { kind: parenthesized_expression } ]
          any: [ { kind: boolean_operator }, { kind: not_operator }, { kind: parenthesized_expression } ]
          matches: condition-slot
rule:
  all:
    - kind: identifier
      pattern: $F
    - matches: in-condition
    - inside:
        kind: module
        stopBy: end
        has:
          any:
            - kind: function_definition
              has: { field: name, pattern: $F }
            - kind: decorated_definition
              has: { kind: function_definition, has: { field: name, pattern: $F } }
    # A parameter or local assignment with the same name shadows the module function.
    - not:
        inside:
          kind: function_definition
          stopBy: end
          any:
            - has: { field: parameters, has: { pattern: $F, stopBy: end } }
            - has: { field: body, has: { kind: assignment, has: { field: left, pattern: $F }, stopBy: end } }
